<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Hub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #1a1a1a, #000000);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    a {
      display: inline-block;
      margin: 10px 15px;
      padding: 12px 24px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00bcd4, #1de9b6);
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    a:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Assignment Questions</h1>
    <a href="q1.txt">Q1</a>
    <a href="q2.txt">Q2</a>
    <a href="q3.txt">Q3</a>
    <a href="q4.txt">Q4</a>
    <a href="q5.txt">Q5</a>
    <a href="q6.txt">Q6</a>
    <a href="q7.txt">Q7</a>
    <a href="q8.txt">Q8</a>
    <a href="q9.txt">Q9</a>
    <a href="q10.txt">Q10</a>
  </div>
</body>
</html>
